<body>
<header class="top"><div><div class="eyebrow">DEINE RADSPORT-KARRIERE</div><h1>Projekt Nizza <b>V14 Trainings-Check</b></h1></div><button id="quick" class="round">+</button></header>
<main>
<section id="view-start" class="view active"></section>
<section id="view-training" class="view"></section>
<section id="view-map" class="view"></section>
<section id="view-tours" class="view"></section>
<section id="view-stats" class="view"></section>
</main>
<nav class="bottom">
<button data-view="start" class="active"><span>⌂</span>Start</button><button data-view="training"><span>▦</span>Training</button><button data-view="map"><span>◎</span>Karte</button><button data-view="tours"><span>♛</span>Touren</button><button data-view="stats"><span>▥</span>Statistik</button>
</nav>
<dialog id="modal" class="modal"></dialog>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const KEY='projekt-nizza-v12-fix2';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const roleLabel={gc:'Gesamtfahrer',climber:'Bergfahrer',helper:'Helfer',sprinter:'Sprinter'};
const stageTypeLabel={flat:'Flachetappe',hilly:'Hügelige Etappe',mountain:'Bergetappe',tt:'Zeitfahren'};
let state=load();
let trainingMode='week';
const todayLocal=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const parseLocalDate=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)};
const localIso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const startMonday=d=>{const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x};
let trainingAnchor=parseLocalDate(todayLocal());
let selectedTrainingDate=todayLocal();
function fresh(){return{trainings:[],teamPool:[],tours:[],activeTourId:null}}
function migrate(raw){
 const out=Object.assign(fresh(),raw&&typeof raw==='object'?raw:{});
 if(!Array.isArray(out.trainings))out.trainings=[];out.trainings=out.trainings.filter(Boolean).map(x=>({...x,id:x.id||uid(),date:x.date||'',title:x.title||'Training',type:x.type||'Sonstiges',zone:x.zone||'',km:+x.km||0,hm:+x.hm||0,min:+x.min||0,details:x.details||'',done:!!x.done,completedAt:x.done?(x.completedAt||''):''}));
 if(!Array.isArray(out.teamPool))out.teamPool=[];
 if(!Array.isArray(out.tours))out.tours=[];
 const poolById=new Map();
 out.teamPool=out.teamPool.filter(Boolean).map(team=>{team.id=team.id||uid();team.name=team.name||'Team';team.color=team.color||'#2aa8ff';if(!Array.isArray(team.riders))team.riders=[];team.riders=team.riders.filter(Boolean).map(r=>({id:r.id||uid(),name:r.name||'Fahrer',role:roleLabel[r.role]?r.role:'helper',nationality:r.nationality||'',birthYear:+r.birthYear||0}));poolById.set(team.id,team);return team});
 for(const tour of out.tours){
  tour.id=tour.id||uid();tour.name=tour.name||'Tour';tour.startDate=tour.startDate||'';if(!Array.isArray(tour.stages))tour.stages=[];if(!Array.isArray(tour.teamIds))tour.teamIds=[];
  if(Array.isArray(tour.teams)){
   for(const legacy of tour.teams){
    if(!legacy)continue;legacy.id=legacy.id||uid();legacy.name=legacy.name||'Team';legacy.color=legacy.color||'#2aa8ff';if(!Array.isArray(legacy.riders))legacy.riders=[];

  }

function trainingsOn(date){return state.trainings.filter(x=>x.date===date).sort((a,b)=>a.title.localeCompare(b.title,'de'))}
function dayName(date,full=false){return new Intl.DateTimeFormat('de-DE',{weekday:full?'long':'short'}).format(date)}
function fullDate(date){return new Intl.DateTimeFormat('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(date)}
function monthTitle(date){return new Intl.DateTimeFormat('de-DE',{month:'long',year:'numeric'}).format(date)}
function metricText(x){const bits=[];if(x.type)bits.push(x.type);if(x.min)bits.push(`${x.min} Min`);if(x.zone)bits.push(x.zone);if(x.km)bits.push(`${x.km} km`);if(x.hm)bits.push(`${x.hm} hm`);return bits.join(' · ')||'Details öffnen'}
function isPastIso(iso){return iso<todayLocal()}
function trainingStatusForDate(iso,events=trainingsOn(iso)){if(!events.length)return'empty';if(events.every(x=>x.done))return'done';if(events.some(x=>x.done))return'partial';return isPastIso(iso)?'missed':'planned'}
function toggleTrainingDone(id){const x=state.trainings.find(t=>t.id===id);if(!x)return;x.done=!x.done;x.completedAt=x.done?new Date().toISOString():'';save()}
function trainingChip(x){return `<div class="training-row"><button class="training-chip ${x.done?'done':''}" data-tr="${x.id}"><strong>${esc(x.title)}</strong><small>${esc(metricText(x))}${x.done?' · ✓ erledigt':''}</small></button><button class="quick-check ${x.done?'done':''}" data-toggle-done="${x.id}" aria-label="${x.done?'Als offen markieren':'Training abhaken'}" title="${x.done?'Wieder öffnen':'Erledigt'}">${x.done?'✓':'○'}</button></div>`}
function dayCard(date){const iso=localIso(date),events=trainingsOn(iso),today=iso===todayLocal(),selected=iso===selectedTrainingDate,status=trainingStatusForDate(iso,events);return `<article class="day-card ${today?'today':''} ${selected?'selected':''} ${status==='done'?'done-day':''} ${status==='missed'?'missed-day':''}" data-day-open="${iso}"><div class="day-date"><small>${esc(dayName(date))}</small><strong>${String(date.getDate()).padStart(2,'0')}</strong><span>${String(date.getMonth()+1).padStart(2,'0')}.${date.getFullYear()}</span>${status==='done'?'<span class="done-mark">✓ geschafft</span>':''}</div><div class="day-events">${events.length?events.map(trainingChip).join(''):`<div class="day-empty"><span>Kein Training geplant</span><button class="secondary" data-add-date="${iso}">+ Eintragen</button></div>`}</div></article>`}
function dayDetail(date){const iso=localIso(date),events=trainingsOn(iso);return `<div class="detail-date">${esc(fullDate(date))}</div>${events.length?events.map(x=>`<article class="day-detail ${x.done?'done-day':''}"><div class="section-head"><div><span class="status-badge ${x.done?'done':''}">${x.done?'✓ Erledigt':'Geplant'}</span><h3>${esc(x.title)}</h3></div><div class="row-actions"><button class="icon edit-btn" data-tr="${x.id}" aria-label="Bearbeiten">✎</button><button class="icon delete-btn" data-del-tr="${x.id}" aria-label="Löschen">⌫</button></div></div><div class="detail-meta">${x.type?`<span class="pill">${esc(x.type)}</span>`:''}${x.zone?`<span class="pill">${esc(x.zone)}</span>`:''}${x.min?`<span class="pill">${x.min} Min</span>`:''}${x.km?`<span class="pill">${x.km} km</span>`:''}${x.hm?`<span class="pill">${x.hm} hm</span>`:''}</div>${x.details?`<p class="detail-text">${esc(x.details)}</p>`:'<p class="muted">Keine Details eingetragen.</p>'}<div class="actions"><button class="${x.done?'secondary':'primary'}" data-toggle-done="${x.id}">${x.done?'↩ Wieder öffnen':'✓ Training abhaken'}</button><button class="secondary" data-tr="${x.id}">Bearbeiten</button><button class="danger" data-del-tr="${x.id}">Löschen</button></div></article>`).join(''):`<div class="empty"><h3>Kein Training geplant</h3><p>Lege für diesen Tag deine Einheit an.</p><button class="primary" data-add-date="${iso}">+ Training anlegen</button></div>`}`}
function monthGrid(date){const y=date.getFullYear(),m=date.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),offset=(first.getDay()+6)%7;let html='<div class="month-weekdays">'+['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<div>${x}</div>`).join('')+'</div><div class="month-grid">';for(let i=0;i<offset;i++)html+='<div class="month-cell blank"></div>';for(let day=1;day<=last.getDate();day++){const d=new Date(y,m,day),iso=localIso(d),events=trainingsOn(iso),status=trainingStatusForDate(iso,events);html+=`<button class="month-cell ${iso===todayLocal()?'today':''} ${iso===selectedTrainingDate?'selected':''} ${status==='done'?'done-day':''} ${status==='partial'?'partial-day':''} ${status==='missed'?'missed-day':''}" data-month-date="${iso}"><span class="month-number">${day}${status==='done'?'<span class="month-check">✓</span>':''}</span>${events.slice(0,2).map(x=>`<span class="month-event ${x.done?'done':(isPastIso(iso)?'missed':'pending')}">${x.done?'✓ ':''}${esc(x.title)}</span>`).join('')}${events.length>2?`<span class="month-event">+${events.length-2}</span>`:''}</button>`}return html+'</div>'}
function periodTrainingStats(){let events=[];if(trainingMode==='month'){events=state.trainings.filter(x=>{const d=parseLocalDate(x.date);return d.getFullYear()===trainingAnchor.getFullYear()&&d.getMonth()===trainingAnchor.getMonth()})}else if(trainingMode==='week'){const start=localIso(startMonday(trainingAnchor)),end=localIso(addDays(startMonday(trainingAnchor),6));events=state.trainings.filter(x=>x.date>=start&&x.date<=end)}else events=trainingsOn(selectedTrainingDate);const done=events.filter(x=>x.done).length,pct=events.length?Math.round(done/events.length*100):0;return{total:events.length,done,pct}}

function riderName(t,id){return allRiders(t).find(r=>r.id===id)?.name||'Unbekannt'}
function teamName(t,id){return allRiders(t).find(r=>r.id===id)?.teamName||''}
function fmtTime(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtGap(sec){sec=Math.max(0,Math.round(sec||0));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `+${h?h+':':''}${String(m).padStart(h?2:1,'0')}:${String(s).padStart(2,'0')}`}
function orderedStages(t){return [...t.stages]}
function gcAfter(t,stage){const stages=orderedStages(t).slice(0,orderedStages(t).indexOf(stage)+1),riders=allRiders(t),rows=[];for(const r of riders){let total=0,ok=true;for(const s of stages){const e=s.results.find(x=>x.riderId===r.id);if(!e){ok=false;break}total+=e.time}if(ok&&stages.length)rows.push({riderId:r.id,time:total})}return rows.sort((a,b)=>a.time-b.time)}

function riderInfo(t,id){return allRiders(t).find(r=>r.id===id)||null}
function youngAfter(t,stage){const year=+(t.startDate||stage?.date||todayLocal()).slice(0,4)||new Date().getFullYear();return gcAfter(t,stage).filter(x=>{const r=riderInfo(t,x.riderId);return r?.birthYear&&year-r.birthYear<=25}).sort((a,b)=>a.time-b.time)}

function addPoints(t,s,key){chooseRiderByTeam(t,id=>editPoints(t,s,key,id),()=>openStage(t,s,key))}
function editPoints(t,s,key,id){const ex=s[key].find(x=>x.riderId===id);modal(`<div class="modal-head"><div class="header-main"><button id="pointsBack" type="button" class="icon back-btn">‹</button><div><div class="eyebrow">${esc(riderName(t,id))}</div><h2>${key==='mountain'?'Bergpunkte':'Sprintpunkte'}</h2></div></div><button data-close class="icon">×</button></div><form id="pointsForm"><label>Punkte<input id="points" type="number" min="0" value="${ex?.points||0}"></label><div class="actions"><button class="primary">Speichern</button>${ex?'<button type="button" id="deletePoints" class="danger">Punkte löschen</button>':''}</div></form>`);$('#pointsBack').onclick=()=>openStage(t,s,key);$('#pointsForm').onsubmit=e=>{e.preventDefault();const p=+$('#points').value||0;s[key]=s[key].filter(x=>x.riderId!==id);if(p>0)s[key].push({riderId:id,points:p});save();openStage(t,s,key)};if(ex)$('#deletePoints').onclick=()=>deleteStageEntry(t,s,key,id)}
function openStage(t,s,tab='stage'){modal(`<div class="full-head"><div class="header-main"><button id="stageBack" class="icon back-btn">‹</button><div class="header-title"><div class="eyebrow">ETAPPE</div><h2>${esc(s.name)}</h2></div></div><div class="header-actions"><button id="stageEdit" class="icon edit-btn">✎</button><button id="stageDelete" class="icon delete-btn">⌫</button><button data-close class="icon">×</button></div></div><div class="full-tabs"><button data-stagetab="stage" class="tab">Etappe</button><button data-stagetab="overall" class="tab">Gesamt</button><button data-stagetab="mountain" class="tab">Berg</button><button data-stagetab="sprint" class="tab">Sprint</button><button data-stagetab="young" class="tab">Nachwuchs</button><button data-stagetab="team" class="tab">Teams</button></div><div id="stageBody" class="full-body"></div>`,true);$('#stageBack').onclick=()=>openTour(t.id,'stages');$('#stageEdit').onclick=()=>openStageForm(t,s);$('#stageDelete').onclick=()=>deleteStage(t,s);$$('[data-stagetab]').forEach(b=>b.onclick=()=>drawStageTab(t,s,b.dataset.stagetab));drawStageTab(t,s,tab)}
function rowsHtml(t,rows,type,editable=false,key='',stage=null){if(!rows.length)return '<div class="empty">Noch keine Einträge.</div>';const leader=type==='time'?rows[0].time:0;return rows.map((r,i)=>`<div class="class-row ${editable?'editable':''}"><div class="rank">${i+1}</div><div><strong>${esc(riderName(t,r.riderId))}</strong><small>${esc(teamName(t,r.riderId))}</small></div><div class="value">${type==='time'?(i===0?fmtTime(r.time):fmtGap(r.time-leader)):r.points+' P'}</div>${editable?`<div class="entry-actions"><button data-edit-entry="${r.riderId}" data-entry-key="${key}" class="edit-btn" aria-label="Bearbeiten">✎</button><button data-delete-entry="${r.riderId}" data-entry-key="${key}" class="delete-btn" aria-label="Löschen">⌫</button></div>`:''}</div>`).join('')}
function drawStageTab(t,s,tab){
 $$('[data-stagetab]').forEach(b=>b.classList.toggle('active',b.dataset.stagetab===tab));const root=$('#stageBody');
 const stageMeta=`<div class="stage-summary"><div><small>Typ</small><strong>${stageTypeLabel[s.type]||'Etappe'}</strong></div><div><small>Distanz</small><strong>${s.distance?s.distance+' km':'–'}</strong></div><div><small>Datum</small><strong>${s.date||'–'}</strong></div></div>`;
 if(tab==='stage'){
  const rows=[...s.results].sort((a,b)=>a.time-b.time);root.innerHTML=`${stageMeta}<article class="card"><div class="section-head"><div><h3>Etappenergebnis</h3><p class="muted">Sieger: volle Zeit. Alle weiteren Fahrer: nur Rückstand.</p></div><div class="compact-actions"><button id="clearResults" class="danger">Alle löschen</button><button id="addResult" class="primary">+ Fahrerzeit</button></div></div>${rowsHtml(t,rows,'time',true,'results',s)}</article>`;$('#addResult').onclick=()=>addStageResult(t,s);$('#clearResults').onclick=()=>{if(s.results.length&&confirm('Alle Etappenzeiten dieser Etappe löschen?')){s.results=[];save();openStage(t,s,'stage')}}
 }else if(tab==='mountain'||tab==='sprint'){
  const rows=[...s[tab]].sort((a,b)=>b.points-a.points);const overall=pointsAfter(t,s,tab);root.innerHTML=`${stageMeta}<article class="card"><div class="section-head"><div><h3>${tab==='mountain'?'Bergpunkte dieser Etappe':'Sprintpunkte dieser Etappe'}</h3><p class="muted">Punkte eintragen, bearbeiten oder löschen.</p></div><div class="compact-actions"><button id="clearPoints" class="danger">Alle löschen</button><button id="addPts" class="primary">+ Punkte</button></div></div>${rowsHtml(t,rows,'points',true,tab,s)}</article><article class="card"><h3>${tab==='mountain'?'Bergwertung gesamt':'Sprintwertung gesamt'}</h3>${rowsHtml(t,overall,'points')}</article>`;$('#addPts').onclick=()=>addPoints(t,s,tab);$('#clearPoints').onclick=()=>{if(s[tab].length&&confirm(`Alle ${tab==='mountain'?'Berg':'Sprint'}punkte dieser Etappe löschen?`)){s[tab]=[];save();openStage(t,s,tab)}}
 }else if(tab==='young'){
  root.innerHTML=`${stageMeta}<article class="card"><div class="class-title"><span class="class-dot white"></span><h3>Nachwuchswertung</h3></div><p class="muted">Automatisch aus dem Gesamtklassement. Fahrer bis einschließlich 25 Jahre; Geburtsjahr im Fahrerpool eintragen.</p>${rowsHtml(t,youngAfter(t,s),'time')}</article>`
 }else if(tab==='team'){
  root.innerHTML=`${stageMeta}<article class="card"><h3>Teamwertung</h3><p class="muted">Automatisch aus den jeweils besten drei Fahrern eines Teams im Gesamtklassement.</p>${teamRowsHtml(teamClassificationAfter(t,s))}</article>`
 }else{
  const gc=gcAfter(t,s),m=pointsAfter(t,s,'mountain'),sp=pointsAfter(t,s,'sprint');root.innerHTML=`${stageMeta}${jerseyCards(t,s)}<article class="card"><div class="class-title"><span class="class-dot yellow"></span><h3>Gesamtklassement</h3></div>${rowsHtml(t,gc,'time')}</article><article class="card"><div class="class-title"><span class="class-dot red"></span><h3>Bergwertung</h3></div>${rowsHtml(t,m,'points')}</article><article class="card"><div class="class-title"><span class="class-dot green"></span><h3>Sprintwertung</h3></div>${rowsHtml(t,sp,'points')}</article>`
 }
 $$('[data-edit-entry]').forEach(b=>b.onclick=()=>{const key=b.dataset.entryKey,id=b.dataset.editEntry;if(key==='results')editStageResult(t,s,id);else editPoints(t,s,key,id)});
 $$('[data-delete-entry]').forEach(b=>b.onclick=()=>deleteStageEntry(t,s,b.dataset.entryKey,b.dataset.deleteEntry))
}
function drawOverall(t,root){const last=[...t.stages].reverse().find(s=>s.results.length||s.mountain.length||s.sprint.length);if(!last){root.innerHTML='<div class="empty">Noch keine Wertungen. Öffne eine Etappe und trage Ergebnisse ein.</div>';return}const gc=gcAfter(t,last),m=pointsAfter(t,last,'mountain'),sp=pointsAfter(t,last,'sprint'),y=youngAfter(t,last),teams=teamClassificationAfter(t,last);root.innerHTML=`<div class="section-head"><div><div class="eyebrow">STAND NACH ${esc(last.name).toUpperCase()}</div><h3>Trikotträger & Klassements</h3></div></div>${jerseyCards(t,last)}<article class="card"><div class="class-title"><span class="class-dot yellow"></span><h3>Gesamtklassement</h3></div>${rowsHtml(t,gc,'time')}</article><article class="card"><div class="class-title"><span class="class-dot green"></span><h3>Sprintwertung</h3></div>${rowsHtml(t,sp,'points')}</article><article class="card"><div class="class-title"><span class="class-dot red"></span><h3>Bergwertung</h3></div>${rowsHtml(t,m,'points')}</article><article class="card"><div class="class-title"><span class="class-dot white"></span><h3>Nachwuchswertung</h3></div>${rowsHtml(t,y,'time')}</article><article class="card"><h3>Teamwertung</h3>${teamRowsHtml(teams)}</article>`}
function renderStats(){const t=totals();$('#view-stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">STATISTIK</div><h2>Dein Fortschritt</h2></div></div><div class="stats"><div class="stat"><small>Kilometer</small><strong>${t.km.toFixed(0)}</strong></div><div class="stat"><small>Höhenmeter</small><strong>${t.hm.toFixed(0)}</strong></div><div class="stat"><small>Fahrzeit</small><strong>${Math.floor(t.min/60)} h</strong></div></div>`}
renderAll();
</script>
</body></html>
