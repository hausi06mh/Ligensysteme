<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liga Studio">
  <title>Fantasy Liga Studio Elite V41</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=631">
</head>
<body>
  <div id="app">
    <main id="startupFallback" style="max-width:680px;margin:40px auto;padding:20px;font-family:system-ui;color:#eef6ff">
      <section style="background:#0b1b29;border:1px solid #24445d;border-radius:20px;padding:20px">
        <h1 style="margin-top:0">Fantasy Liga Elite wird geladen …</h1>
        <p>Falls dieser Hinweis nach wenigen Sekunden stehen bleibt, lade die Seite einmal neu.</p>
      </section>
    </main>
  </div>
  <div id="overlay"></div>
  <div id="toast" class="toast hidden"></div>
  <div id="contextMenu"></div>
  <script type="module" src="./app.js?v=631"></script>
  <script>
    window.__FLE_BOOT_OK__ = false;
    window.addEventListener("fle:boot-ok", () => { window.__FLE_BOOT_OK__ = true; });
    window.addEventListener("load", async () => {
      try {
        if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            if (reg.scope.includes(location.pathname.replace(/[^/]*$/, ""))) await reg.unregister();
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(k => k.startsWith("fantasy-liga-")).map(k => caches.delete(k)));
          }
          await navigator.serviceWorker.register("./sw.js?v=631", {scope:"./", updateViaCache:"none"});
        }
      } catch (e) { console.warn("Cache-Neustart:", e); }
      setTimeout(() => {
        if (window.__FLE_BOOT_OK__) return;
        const box = document.querySelector("#startupFallback section");
        if (box) box.innerHTML = `<h1 style="margin-top:0">Fantasy Liga Elite konnte nicht starten</h1>
          <p>Die App-Datei wurde nicht geladen. Dein Spielstand wurde nicht gelöscht.</p>
          <button onclick="location.reload()" style="font:inherit;padding:12px 16px;border-radius:12px;border:0;font-weight:800">Neu laden</button>`;
      }, 7000);
    });
  </script>
</body>
</html>
