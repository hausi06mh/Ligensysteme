<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liga Studio">
  <title>Fantasy Liga Studio Elite V64</title>
  <link rel="manifest" href="./manifest.webmanifest?v=632">
  <link rel="apple-touch-icon" href="./icon-192.png?v=632">
  <link rel="stylesheet" href="./styles640.css?v=640">
</head>
<body>
  <div id="app">
    <main id="startupFallback" style="max-width:680px;margin:40px auto;padding:20px;font-family:system-ui;color:#eef6ff">
      <section style="background:#0b1b29;border:1px solid #24445d;border-radius:20px;padding:20px">
        <h1 style="margin-top:0">Fantasy Liga Elite startet neu …</h1>
        <p>Alte Browser-Caches werden einmalig entfernt. Dein Spielstand bleibt erhalten.</p>
      </section>
    </main>
  </div>
  <div id="overlay"></div><div id="toast" class="toast hidden"></div><div id="contextMenu"></div>
  <script>
  (async()=>{
    const fallback=(title,msg)=>{const box=document.querySelector('#startupFallback section');if(box)box.innerHTML='<h1 style="margin-top:0">'+title+'</h1><p>'+msg+'</p><button onclick="location.reload()" style="font:inherit;padding:12px 16px;border-radius:12px;border:0;font-weight:800">Neu laden</button>';};
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
      }
      if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));}
      window.__FLE_BOOT_OK__=false;
      window.addEventListener('fle:boot-ok',()=>window.__FLE_BOOT_OK__=true,{once:true});
      await import('./app640.js?v=640-20260826');
      setTimeout(()=>{if(!window.__FLE_BOOT_OK__ && document.querySelector('#startupFallback')) fallback('Start dauert zu lange','Die neue App-Datei wurde geladen, aber der Start wurde nicht abgeschlossen. Bitte einmal neu laden.');},8000);
    }catch(e){console.error(e);fallback('App-Datei konnte nicht geladen werden','Bitte lade diese Seite einmal neu. Dein lokaler Spielstand wird nicht gelöscht. Fehler: '+String(e&&e.message||e));}
  })();
  </script>
</body>
</html>
